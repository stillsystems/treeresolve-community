name: "Bug Report"
description: "File an issue about a bug or unexpected merge behavior in TreeResolve"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with TreeResolve! Please provide as much detail as possible to help us reproduce and resolve the problem quickly.

  - type: input
    id: version
    attributes:
      label: TreeResolve Version
      description: What version of TreeResolve are you using? (Check VS Code Extensions panel or `treeresolve --version`)
      placeholder: "e.g., v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running?
      options:
        - Windows
        - macOS (Apple Silicon / M-series)
        - macOS (Intel)
        - Linux (Ubuntu / Debian)
        - Linux (Fedora / RHEL / Arch)
        - Other
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VS Code Version
      description: What version of VS Code or editor environment?
      placeholder: "e.g., 1.90.0, Cursor, VSCodium"
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Programming Language / File Type
      description: Which language or file extension experienced the conflict?
      placeholder: "e.g., TypeScript (.ts), Python (.py), Go (.go), package-lock.json"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: conflict-sample
    attributes:
      label: Conflict Snippet / Reproduction Steps
      description: Include the raw Git conflict markers or reproduction steps if possible (strip proprietary secrets or PII).
      render: text
      placeholder: |
        <<<<<<< HEAD
        const x = 1;
        =======
        const x = 2;
        >>>>>>> branch-b

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log Output or Screenshots
      description: Paste any output from the TreeResolve Output channel or attach screenshots.
